<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luyện tập CSS basic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./exercise03.css" />
  </head>
  <body>
    <form action>
      <h1>Liên hệ với chúng tôi</h1>
      <label for="Tên">Họ và tên</label>
      <input id="Tên" type="text" name="Họ và tên" placeholder="TRAN DUC HUY" />
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="Email"
        placeholder="duchuy210300@gmail.com"
      />
      <label for="Tinnhan">Tin nhắn</label>
      <textarea
        id="Tinnhan"
        type="text"
        name="Tin nhắn"
        rows="5"
        cols="20"
      ></textarea>
      <button type="submit">Gứi</button>
    </form>
  </body>
</html>
